<!doctype html><meta charset="utf-8"><title>KRAUDE LAND</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#04070b;color:#dff;font:13px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh}.panel{background:#06131ee8;border:1px solid #22dff755;backdrop-filter:blur(12px);box-shadow:0 12px 50px #0008}.top{position:fixed;z-index:5;left:12px;right:12px;top:10px;padding:8px;border-radius:12px;display:flex;gap:5px;align-items:center;overflow:auto}.brand{font-weight:800;letter-spacing:.14em;margin-right:12px;white-space:nowrap}.tab,.camera{background:#08202b;color:#dff;border:1px solid #23dff766;padding:6px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}.tab.active{background:#0b4354}.side{position:fixed;z-index:4;right:12px;top:62px;bottom:12px;width:min(390px,42vw);padding:12px;border-radius:12px;overflow:auto}pre{white-space:pre-wrap;font-size:11px;color:#aee}h3{margin:4px 0 8px}.badge{display:inline-block;padding:2px 6px;border:1px solid #2cf7;border-radius:12px;margin:2px}.cams{position:fixed;z-index:4;left:12px;bottom:12px;padding:8px;border-radius:10px}.status{opacity:.7;margin-left:auto;white-space:nowrap}
</style>
<div class="top panel"><span class="brand">KRAUDE LAND</span><div id="tabs"></div><span id="status" class="status">CONNECTING</span></div>
<div class="side panel"><h3 id="title">LAND</h3><div id="content">Loading runtime truth…</div></div>
<div class="cams panel"><button class="camera" data-camera="MASTER">MASTER VIEW</button><button class="camera" data-camera="WALK">WALK VIEW</button><button class="camera" data-camera="BUILDING">BUILDING VIEW</button></div>
<canvas id="world"></canvas>
<script type="module">
import {createWorldRenderer} from './world-renderer.js';
const TABS=['LAND','AGENTS','PROJECTS','MISSIONS','PARTIES','EVIDENCE','EVENTS','AUTHORITY','RESOURCES'];let active='LAND',camera='MASTER',snapshot=null;const tabs=document.querySelector('#tabs');for(const t of TABS){const b=document.createElement('button');b.className='tab';b.textContent=t;b.onclick=()=>{active=t;renderPanel()};tabs.append(b)}
const renderer=createWorldRenderer(document.querySelector('#world'),{onPick:({kind,data})=>{document.querySelector('#title').textContent=`${kind.toUpperCase()} · ${data.id}`;document.querySelector('#content').innerHTML=`<pre>${escapeHtml(JSON.stringify(data,null,2))}</pre>`}});document.querySelectorAll('.camera').forEach(b=>b.onclick=()=>{camera=b.dataset.camera;renderer.setCamera(camera);renderPanel()});
const api=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json()};
async function refresh(){try{snapshot=await api('/api/world');renderer.setSnapshot(snapshot);document.querySelector('#status').textContent='RUNTIME ONLINE';document.querySelector('#status').style.color='#7fffb0';if(active==='LAND')renderPanel()}catch(e){document.querySelector('#status').textContent='RUNTIME OFFLINE';document.querySelector('#status').style.color='#ff7788'}setTimeout(refresh,1000)}
async function renderPanel(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent===active));document.querySelector('#title').textContent=`${active} · ${camera}`;let data;if(active==='LAND')data=snapshot;else if(active==='AGENTS')data=await api('/api/agents');else if(active==='MISSIONS')data=await api('/api/missions');else if(active==='PARTIES')data=await api('/api/parties');else if(active==='EVIDENCE')data=await api('/api/evidence');else if(active==='EVENTS')data=await api('/api/events');else if(active==='AUTHORITY')data=await api('/api/authority');else if(active==='RESOURCES')data=await api('/api/report');else if(active==='PROJECTS')data=await api('/api/atlas');else data={note:'Unknown view'};document.querySelector('#content').innerHTML=`<div><span class="badge">truth: SQLite + ledger</span><span class="badge">camera: ${camera}</span></div><pre>${escapeHtml(JSON.stringify(data,null,2))}</pre>`}
const escapeHtml=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));refresh();
</script>
